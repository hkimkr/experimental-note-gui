<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#18553f" />
    <meta name="application-version" content="3.2.0" />
    <meta name="description" content="실험 프로토콜, 노트, 메모, 재고를 프로젝트별로 관리하는 실험 노트 GUI" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="실험 노트 ver3 · Experimental Note GUI" />
    <meta property="og:description" content="프로토콜부터 결과까지, 한곳에서." />
    <meta property="og:image" content="https://hkimkr.github.io/experimental-note-gui/assets/app-preview.png?v=3.2.0" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="실험 노트 ver3 · Experimental Note GUI" />
    <meta name="twitter:description" content="프로토콜부터 결과까지, 한곳에서." />
    <meta name="twitter:image" content="https://hkimkr.github.io/experimental-note-gui/assets/app-preview.png?v=3.2.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png?v=3.2.0" />
    <link rel="icon" type="image/png" sizes="48x48" href="./assets/favicon-48.png?v=3.2.0" />
    <link rel="shortcut icon" href="./assets/favicon-48.png?v=3.2.0" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png?v=3.2.0" />
    <link rel="manifest" href="./manifest.webmanifest?v=3.2.0" />
    <link rel="stylesheet" href="./app.css?v=3.2.0" />
    <title>실험 노트 ver3 · Experimental Note GUI</title>
  </head>
  <body>
    <main class="planner-shell">
      <iframe
        id="exp-note-frame"
        class="planner-frame"
        src="./app.html?v=3.2.0"
        title="실험 노트 GUI"
        allow="clipboard-read; clipboard-write"
      ></iframe>

      <button class="cloud-sync-launcher" id="cloud-sync-launcher" type="button">
        <span class="cloud-sync-dot" id="cloud-sync-dot"></span>
        <span id="cloud-sync-label">클라우드 로그인</span>
      </button>

      <button class="app-install-launcher" id="app-install-launcher" type="button">
        <img src="./assets/icon-192.png" alt="" />
        <span>앱 설치</span>
      </button>

      <div class="cloud-auth-backdrop" id="cloud-auth-backdrop" hidden>
        <section
          class="cloud-auth-card"
          role="dialog"
          aria-modal="true"
          aria-labelledby="cloud-auth-title"
        >
          <header class="cloud-auth-head">
            <div>
              <h1 id="cloud-auth-title">클라우드 동기화</h1>
              <p>컴퓨터와 휴대폰에서 같은 계정으로 로그인하세요.</p>
            </div>
            <button class="cloud-auth-close" id="cloud-auth-close" type="button" aria-label="닫기">
              ×
            </button>
          </header>

          <div class="cloud-auth-body">
            <div id="cloud-signed-out">
              <label class="cloud-auth-label" for="cloud-email">이메일</label>
              <input
                class="cloud-auth-field"
                id="cloud-email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
              />
              <label class="cloud-auth-label" for="cloud-password">비밀번호</label>
              <input
                class="cloud-auth-field"
                id="cloud-password"
                type="password"
                autocomplete="current-password"
                minlength="6"
                placeholder="6자 이상"
              />
              <p class="cloud-auth-error" id="cloud-auth-error" role="alert"></p>
              <div class="cloud-auth-actions">
                <button class="cloud-auth-button secondary" id="cloud-signup" type="button">
                  회원가입
                </button>
                <button class="cloud-auth-button" id="cloud-signin" type="button">
                  로그인
                </button>
              </div>
            </div>

            <div id="cloud-signed-in" hidden>
              <div class="cloud-account">
                로그인 계정
                <strong id="cloud-account-email"></strong>
              </div>
              <div class="cloud-status" id="cloud-status">클라우드 확인 중…</div>
              <button class="cloud-auth-button" id="cloud-signout" type="button">로그아웃</button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <noscript>이 앱을 사용하려면 브라우저에서 JavaScript를 활성화해주세요.</noscript>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./sync-app.js?v=3.2.0"></script>
    <script>
      (() => {
        const installButton = document.getElementById("app-install-launcher");
        let installPrompt = null;
        const isInstalled = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
        if (isInstalled()) installButton.hidden = true;
        window.addEventListener("beforeinstallprompt", (event) => {
          event.preventDefault();
          installPrompt = event;
          installButton.hidden = false;
        });
        window.addEventListener("appinstalled", () => {
          installPrompt = null;
          installButton.hidden = true;
        });
        installButton.addEventListener("click", async () => {
          if (installPrompt) {
            installPrompt.prompt();
            await installPrompt.userChoice;
            installPrompt = null;
            return;
          }
          const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
          window.alert(isIos ? "Safari 공유 버튼을 누른 뒤 ‘홈 화면에 추가’를 선택해주세요." : "브라우저 주소창의 설치 아이콘 또는 메뉴의 ‘앱 설치’를 선택해주세요.");
        });
      })();
    </script>
  </body>
</html>
