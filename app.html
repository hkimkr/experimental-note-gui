            <div className="row"><input type="color" className="color-select" value={project.color} onChange={e => updateProject(setStore, project.id, p => ({ ...p, color: e.target.value }))} aria-label="프로젝트 색상" /><input className="field grow" value={project.name} onChange={e => updateProject(setStore, project.id, p => ({ ...p, name: e.target.value }))} aria-label="프로젝트 이름" /></div>
            <div><label className="label">실험 목적</label><textarea className="field" value={project.purpose} onChange={e => updateProject(setStore, project.id, p => ({ ...p, purpose: e.target.value }))} /></div>
            <div><label className="label">실험 조건</label><textarea className="field" value={project.conditions} onChange={e => updateProject(setStore, project.id, p => ({ ...p, conditions: e.target.value }))} /></div>
            <div><label className="label">메모</label><textarea className="field" value={project.memo} onChange={e => updateProject(setStore, project.id, p => ({ ...p, memo: e.target.value }))} /></div>
            <Button className="soft" onClick={() => {
              const p = emptyProject("새 프로젝트", COLORS[store.projects.length % COLORS.length]);
              setStore(s => ({ ...s, projects: [...s.projects, p], activeProjectId: p.id }));
            }}>+ 프로젝트</Button>
          </div>
        );
      }

      function ProjectLibrary({ store, setStore, onOpen }) {
        const [dragId, setDragId] = useState(null);
        const holdRef = useRef({ timer: null, active: false, moved: false, id: null });
        const reorder = (fromId, toId) => {
          if (!fromId || !toId || fromId === toId) return;
          setStore(s => {
            const from = s.projects.findIndex(p => p.id === fromId), to = s.projects.findIndex(p => p.id === toId);
            if (from < 0 || to < 0) return s;
            const projects = [...s.projects], [item] = projects.splice(from, 1); projects.splice(to, 0, item);
            return { ...s, projects };
          });
        };
        const clearHold = () => { clearTimeout(holdRef.current.timer); holdRef.current.active = false; setDragId(null); };
        const startTouch = (e, id) => {
          if (e.pointerType === "mouse") return;
          holdRef.current = { timer: setTimeout(() => { holdRef.current.active = true; setDragId(id); navigator.vibrate?.(30); }, 520), active: false, moved: false, id };
          e.currentTarget.setPointerCapture?.(e.pointerId);
        };
        const moveTouch = (e) => {
          if (!holdRef.current.active) return;
          e.preventDefault(); holdRef.current.moved = true;
          const target = document.elementFromPoint(e.clientX, e.clientY)?.closest?.("[data-project-id]");
          if (target?.dataset?.projectId) { reorder(holdRef.current.id, target.dataset.projectId); holdRef.current.id = target.dataset.projectId; }
        };
        return (
          <main className="library">
            <div className="library-head"><div><div className="eyebrow">PROJECT LIBRARY</div><h1 className="page-title">나의 실험 프로젝트</h1><div className="page-sub">책을 열어 프로젝트를 시작하세요. 드래그하거나 모바일에서 길게 눌러 순서를 바꿀 수 있습니다.</div></div>
              <Button className="primary" onClick={() => { const p = emptyProject("새 프로젝트", COLORS[store.projects.length % COLORS.length]); setStore(s => ({ ...s, projects: [...s.projects, p] })); }}>+ 프로젝트 추가</Button>
            </div>
            <div className="bookshelf">
              {store.projects.map((p, index) => <div className="book-wrap" key={p.id} data-project-id={p.id} draggable onDragStart={() => setDragId(p.id)} onDragOver={e => e.preventDefault()} onDrop={() => { reorder(dragId, p.id); setDragId(null); }}>
                <div className={`book ${dragId === p.id ? "dragging" : ""}`} style={{ background: `linear-gradient(145deg, ${p.color}, color-mix(in srgb, ${p.color} 70%, #17231d))` }} role="button" tabIndex="0" onKeyDown={e => { if (e.key === "Enter" || e.key === " ") onOpen(p.id); }} onClick={e => { if (holdRef.current.moved) { holdRef.current.moved = false; return; } if (!e.target.closest("input,button")) onOpen(p.id); }} onPointerDown={e => startTouch(e, p.id)} onPointerMove={moveTouch} onPointerUp={clearHold} onPointerCancel={clearHold}>
                  <div><div className="book-kicker">LAB PROJECT · {String(index + 1).padStart(2,"0")}</div><input className="book-name" value={p.name} onClick={e => e.stopPropagation()} onPointerDown={e => e.stopPropagation()} onChange={e => updateProject(setStore, p.id, pr => ({ ...pr, name: e.target.value }))} aria-label={`${p.name} 프로젝트 이름`} /></div>
                  <div className="book-stats">실험 {p.experiments.length} · 노트 {p.notes.length} · 재고 {p.inventory.length}</div>
                  <span className="book-handle" aria-hidden="true">⠿</span>
                </div>
              </div>)}
              <button className="add-book" onClick={() => { const p = emptyProject("새 프로젝트", COLORS[store.projects.length % COLORS.length]); setStore(s => ({ ...s, projects: [...s.projects, p] })); }}><div><span>＋</span>새 프로젝트 책 만들기</div></button>
            </div>
            <div className="shelf-line" />
          </main>
        );
      }

      function ProjectHub({ project, onBack, onSelect }) {
        const tiles = [
          ["protocol","▤","프로토콜","재현 가능한 절차와 버전을 설계합니다."],
          ["notes","✎","실험 노트","실험 실행, 변경 사항과 결과를 기록합니다."],
          ["memo","◫","실험 메모","빠른 메모와 아이디어를 모아둡니다."],
          ["inventory","▦","재고 관리","시약과 소모품의 현재 상태를 관리합니다."],
        ];
        return <main className="project-hub"><button className="back-library" onClick={onBack}>← 프로젝트 서재</button><div className="hub-hero"><div className="eyebrow">CURRENT PROJECT</div><h1 className="page-title">{project.name}</h1><div className="page-sub">작업할 영역을 선택하세요.</div></div><div className="hub-grid">{tiles.map(([id,icon,title,desc]) => <button key={id} className="hub-tile" onClick={() => onSelect(id)}><span className="hub-icon">{icon}</span><strong>{title}</strong><span>{desc}</span></button>)}</div></main>;
      }

      function DataTools({ store, setStore, toast }) {
        const exportData = () => {
          const blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `exp-note-backup-${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
        };
        const importData = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try { setStore(normalizeStore(JSON.parse(reader.result))); toast("가져오기 완료"); }
            catch { toast("파일 형식 오류"); }
          };
          reader.readAsText(file);
        };
        return (
          <div className="row">
            <Button className="soft" onClick={exportData}>JSON 백업</Button>
            <label className="btn soft" style={{ display: "inline-flex", alignItems: "center" }}>가져오기<input type="file" accept=".json" hidden onChange={importData} /></label>
          </div>
        );
      }

      function App() {
        const [store, setStore] = useState(loadStore);
        const [screen, setScreen] = useState("library");
        const [saveState, setSaveState] = useState("저장됨");
        const [toastMsg, setToastMsg] = useState("");
        const skipRef = useRef(false);
        const storeRef = useRef(store);
        storeRef.current = store;
        const loadCurrentView = () => {
          try { const s = sessionStorage.getItem(VIEW_STORAGE_KEY); return VALID_VIEWS.includes(s) ? s : "protocol"; } catch { return "protocol"; }
        };
        const [view, setView] = useState(loadCurrentView);
        const project = getActiveProject(store);
        const toast = (text) => { setToastMsg(text); clearTimeout(toast.t); toast.t = setTimeout(() => setToastMsg(""), 2800); };
        toast.t = null;

        useEffect(() => {
          const receive = (event) => {
            if (event.origin !== window.location.origin || event.source !== window.parent || event.data?.type !== "exp-note-cloud-store" || !event.data.store) return;
            skipRef.current = true;
            setStore(normalizeStore(event.data.store));
            setSaveState("저장됨");
            window.parent.postMessage({ type: "exp-note-cloud-store-applied", fingerprint: event.data.fingerprint || "" }, window.location.origin);
          };
          window.addEventListener("message", receive);
          if (window.parent !== window) window.parent.postMessage({ type: "exp-note-ready" }, window.location.origin);
          return () => window.removeEventListener("message", receive);
        }, []);

        useEffect(() => {
          if (window.parent === window) return;
          let blurTimer = null;
          const isText = (t) => t instanceof HTMLElement && (t.matches("textarea,[contenteditable='true']") || (t.matches("input") && !["button","checkbox","file","hidden","radio","range","submit"].includes((t.getAttribute("type")||"text").toLowerCase())));
          const postEdit = (editing, includeStore = false) => {
            let raw = "";
            if (includeStore) try { raw = JSON.stringify(storeRef.current); } catch { raw = ""; }
            window.parent.postMessage({ type: "exp-note-editing", editing, raw }, window.location.origin);
          };
          const onFocusIn = (e) => { if (!isText(e.target)) return; clearTimeout(blurTimer); postEdit(true); };
          const onFocusOut = (e) => {
            if (!isText(e.target)) return;
            blurTimer = setTimeout(() => { if (!isText(document.activeElement)) postEdit(false, true); }, 320);
          };
          document.addEventListener("focusin", onFocusIn);
          document.addEventListener("focusout", onFocusOut);
          return () => { clearTimeout(blurTimer); document.removeEventListener("focusin", onFocusIn); document.removeEventListener("focusout", onFocusOut); };
        }, []);

        useEffect(() => { try { sessionStorage.setItem(VIEW_STORAGE_KEY, view); } catch {} }, [view]);

        useEffect(() => {
          if (skipRef.current) { skipRef.current = false; return; }
          let raw = "";
          try {
            raw = JSON.stringify(store);
            if (window.parent !== window) window.parent.postMessage({ type: "exp-note-local-store", raw }, window.location.origin);
          } catch { setSaveState("저장 실패"); toast("저장 공간 확인"); return; }
          setSaveState("저장 중");
          const id = setTimeout(() => {
            try {
              localStorage.setItem(STORAGE_KEY, raw);
              localStorage.setItem(LOCAL_UPDATED_KEY, String(Date.now()));
              localStorage.setItem(PENDING_SYNC_KEY, JSON.stringify({ raw, updatedAt: Date.now() }));
              setSaveState("저장됨");
            } catch { setSaveState("저장 실패"); }
          }, 250);
          return () => clearTimeout(id);
        }, [store]);

        return (
          <div className="app">
            <header className="header no-print">
              <div className="header-inner">
                <button className="brand" style={{ border: 0, background: "transparent", padding: 0, textAlign: "left" }} onClick={() => setScreen("library")}><div className="brand-mark">🧪</div><div><strong>실험 노트</strong><small>Experimental Note GUI</small></div></button>
                {screen === "tool" && <nav className="nav" aria-label="주요 보기">
                  {[["protocol","프로토콜"],["notes","실험 노트"],["memo","실험 메모"],["inventory","재고 관리"]].map(([v,l]) => (
                    <button key={v} className={view === v ? "active" : ""} onClick={() => setView(v)}>{l}</button>
                  ))}
                </nav>}
                <div className="header-actions">
                  <span className="save-state">{saveState}</span>
                  <DataTools store={store} setStore={setStore} toast={toast} />
                </div>
              </div>
            </header>
            {screen === "library" && <ProjectLibrary store={store} setStore={setStore} onOpen={id => { setStore(s => ({ ...s, activeProjectId: id })); setScreen("hub"); }} />}
            {screen === "hub" && <div className="shell"><ProjectHub project={project} onBack={() => setScreen("library")} onSelect={v => { setView(v); setScreen("tool"); }} /></div>}
            {screen === "tool" && <div className="shell"><main className="main"><button className="back-library" onClick={() => setScreen("hub")}>← {project.name}</button>
              {view === "protocol" && <ProtocolView project={project} setStore={setStore} toast={toast} />}
              {view === "notes" && <NotesView project={project} setStore={setStore} toast={toast} />}
              {view === "memo" && <MemoView project={project} setStore={setStore} toast={toast} />}
              {view === "inventory" && <InventoryView project={project} setStore={setStore} />}
            </main></div>}
            {toastMsg && <div className="toast no-print">{toastMsg}</div>}
          </div>
        );
      }

      try {
        if (!window.React || !window.ReactDOM?.createRoot) {
          throw new Error("React 또는 ReactDOM CDN 로드 실패");
        }
        window.__expNoteMounted = true;
        ReactDOM.createRoot(document.getElementById("app")).render(<App />);
      } catch (e) {
        window.__expNoteBootError = e.message || String(e);
        const el = document.getElementById("app");
        if (el) {
          el.innerHTML =
            `<div style="padding:24px;font-family:sans-serif"><strong style="color:#e85d5d">앱 시작 실패</strong>` +
            `<p style="margin:8px 0 0;font-size:13px">${window.__expNoteBootError}</p></div>`;
        }
      }
    </script>
  </body>
</html>
