      .breadcrumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}.breadcrumb button{border:0;background:transparent;color:var(--brand);font-weight:700;padding:0}
      .toast{position:fixed;right:22px;bottom:22px;z-index:100;background:#2c3340;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px}
      .print-root{display:none;background:#fff;color:#17231d;padding:8mm;width:277mm;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.print-root.exporting{display:block;position:absolute;left:0;top:0;z-index:1000;pointer-events:none;box-shadow:0 20px 60px rgba(0,0,0,.18)}.print-header{border-bottom:1.2mm solid #1f6b4f;padding-bottom:4mm;margin-bottom:4mm}.print-kicker{color:#1f6b4f;font-size:8px;font-weight:900;letter-spacing:.18em}.print-title{margin:1mm 0 2mm;font-size:22px;line-height:1.15}.print-subtitle{display:flex;gap:3mm;flex-wrap:wrap;color:#65736b;font-size:8.5px}.print-subtitle span{padding:1mm 2mm;border-radius:99px;background:#edf5f1}.print-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm;margin-bottom:5mm}.print-summary-block{border:1px solid #dfe8e3;border-radius:2.5mm;padding:2.5mm;background:#f9fbfa;font-size:8.5px;line-height:1.45;white-space:pre-wrap}.print-summary-block strong{display:block;color:#1f6b4f;font-size:7.5px;letter-spacing:.06em;margin-bottom:1mm}.print-steps-grid{column-count:2;column-gap:5mm}.print-step{display:inline-block;width:100%;vertical-align:top;break-inside:avoid;page-break-inside:avoid;border:1px solid #dce6e0;border-radius:3mm;background:#fff;margin:0 0 4mm;overflow:hidden}.print-step-head{display:grid;grid-template-columns:8mm minmax(0,1fr) auto;gap:2mm;align-items:center;padding:2.5mm 3mm;background:#eef5f1;border-bottom:1px solid #dce6e0}.print-step-num{width:7mm;height:7mm;border-radius:50%;display:grid;place-items:center;background:#1f6b4f;color:#fff;font-size:9px;font-weight:900}.print-step-title{font-size:11px;font-weight:900;line-height:1.2}.print-timing{color:#57675e;font-size:7.5px;font-weight:800}.print-step-body{padding:2.5mm 3mm}.print-step-text{font-size:8.5px;white-space:pre-wrap;margin:0 0 2mm;line-height:1.5}.print-panel-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(38mm,1fr));gap:2mm;margin-bottom:2mm}.print-static-panel{border:1px solid #dce6e0;border-radius:2mm;overflow:hidden;font-size:7.5px}.print-static-head{padding:1.5mm 2mm;background:#f3f7f5;color:#1f6b4f;font-weight:900}.print-static-body{padding:1.5mm 2mm}.print-static-table{width:100%;border-collapse:collapse}.print-static-table th,.print-static-table td{border-bottom:1px solid #e7ede9;padding:1mm;text-align:left}.print-static-table th{color:#66756d;font-size:7px}.print-static-table tr:last-child td{border-bottom:0}.print-method{white-space:pre-wrap;line-height:1.5}.print-callout{margin-top:2mm;padding:1.5mm 2mm;border-left:1.2mm solid #d8921b;background:#fff8df;color:#6f4700;font-size:7.5px;font-weight:800}.print-total{font-weight:900;color:#1f6b4f}.print-footer{margin-top:3mm;text-align:right;color:#849089;font-size:7px}
      @page{size:A4 landscape;margin:8mm}@media print{body{background:#fff}.no-print,.screen-only,.back-library{display:none!important}.print-root{display:block!important;position:static!important;width:auto;padding:0}.print-steps-grid{column-count:2}}
      @media(max-width:900px){.protocol-workspace{grid-template-columns:1fr}.protocol-overview{position:static}.nature-fields{grid-template-columns:1fr}}
      @media(max-width:760px){.header-inner{padding:10px 12px;gap:9px}.brand small,.save-state{display:none}.nav{order:3;width:100%;overflow:auto}.nav button{flex:1}.shell{padding:12px}.library{padding:20px 14px}.library-head{align-items:flex-start;flex-direction:column}.library-head h1{font-size:30px}.bookshelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.book,.add-book{min-height:220px}.book-title{font-size:20px}.book-name{font-size:17px}.hub-grid{grid-template-columns:1fr}.page-title{font-size:23px}.panel-row-layout{flex-direction:column}.panel-row{width:100%;flex-direction:column}.panel-instance,.panel-instance.reagent{width:100%;max-width:none;flex-basis:auto}.panel-primary-tools{margin-left:0}.proto-panel,.proto-panel.reagent-panel{max-width:none;min-width:0}.inventory-row{grid-template-columns:1fr;gap:8px}.hero{display:block}.condition-label-list{grid-template-columns:1fr}.step-timing{width:100%}.run-fields,.note-conclusion-grid{grid-template-columns:1fr}.execution-summary{top:64px}}
      @media(max-width:460px){.bookshelf{grid-template-columns:1fr}.book,.add-book{min-height:205px}}
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-status" style="padding:24px;font-family:sans-serif;color:#566159">
        앱을 불러오는 중…
      </div>
    </div>
    <script>
      window.__expNoteBootError = null;
      window.addEventListener("error", function (e) {
        window.__expNoteBootError = e.error?.message || e.message || "알 수 없는 오류";
        var el = document.getElementById("boot-status");
        if (el) {
          el.innerHTML =
            "<strong style='color:#e85d5d'>앱 로드 실패</strong><p style='margin:8px 0 0;font-size:13px;line-height:1.5'>" +
            window.__expNoteBootError +
            "</p><p style='font-size:12px;color:#8b95a1'>F12 → Console 탭에서 자세한 오류를 확인하세요.<br>또는 CDN(React/Babel) 차단 여부를 확인하세요.</p>";
        }
      });
      window.setTimeout(function () {
        if (document.getElementById("boot-status") && !window.__expNoteMounted) {
          var el = document.getElementById("boot-status");
          el.innerHTML =
            "<strong style='color:#e85d5d'>앱이 시작되지 않았습니다</strong>" +
            "<p style='margin:8px 0 0;font-size:13px'>React/Babel CDN 로드 실패 가능성이 있습니다. 네트워크 또는 광고 차단기를 확인하세요.</p>" +
            "<p style='font-size:12px;color:#8b95a1'><a href='./app.html'>app.html</a>을 직접 열어 Console 오류를 확인해주세요.</p>";
        }
      }, 8000);
    </script>
    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo, useCallback } = React;

      const STORAGE_KEY = "hamin-exp-note-v1";
      const LOCAL_UPDATED_KEY = "hamin-exp-note-v1-local-updated-at";
      const PENDING_SYNC_KEY = "hamin-exp-note-v1-pending-sync";
      const VIEW_STORAGE_KEY = "exp-note-current-view";
      const VALID_VIEWS = ["protocol", "notes", "memo", "inventory"];
      const COLORS = ["#5b7cfa", "#4caf7d", "#f5a623", "#e85d5d", "#9b59b6", "#1abc9c", "#e67e22", "#34495e"];
      const INVENTORY_LEVELS = ["전부 소진", "당장 주문", "살짝 위험", "괜찮음", "넉넉함"];
      const INVENTORY_COLORS = ["#e85d5d", "#f5a623", "#f0c674", "#8bc78b", "#4caf50"];
      const MEMO_CANVAS_W = 1400;
      const MEMO_CANVAS_H = 900;
      const DEFAULT_PROJECT_ID = "project-default";

      const uid = () => `id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
      const clone = (v) => (v == null ? v : JSON.parse(JSON.stringify(v)));
      const fmtDate = (d) => { const x = d instanceof Date ? d : new Date(d); return isNaN(x) ? "" : x.toLocaleDateString("ko-KR"); };
      const fmtDateTime = (t) => t ? new Date(t).toLocaleString("ko-KR", { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }) : "";
      const isImeComposing = (e) => e.nativeEvent?.isComposing || e.isComposing;
      const parseVolume = (v) => { const n = parseFloat(String(v).replace(/[^\d.-]/g, "")); return isNaN(n) ? 0 : n; };
      const sumVolumes = (rows) => rows.reduce((s, r) => s + parseVolume(r.volume), 0);
      const summarizePanel = (panel) => {
        if (!panel) return "";
        if (panel.type === "reagent") return (panel.rows || []).filter(r => r.material || r.volume).map(r => `${r.material || "시약"} ${r.volume || ""}${panel.unit || ""}`.trim()).join(", ");
        if (panel.type === "condition") return (panel.rows || []).map(r => [r.temp && `${r.temp}°C`, r.duration, r.rpm && `${r.rpm} rpm`, r.note].filter(Boolean).join(" · ")).filter(Boolean).join(" / ");
        return panel.content || "";
      };

      const emptyReagentRow = () => ({ id: uid(), material: "", volume: "", highlight: false });
      const emptyConditionRow = () => ({ id: uid(), temp: "", duration: "", rpm: "", note: "" });
      const emptyPanel = (type) => {
        if (type === "reagent") return { id: uid(), type, unit: "uL", rows: [emptyReagentRow(), emptyReagentRow()] };
        if (type === "condition") return { id: uid(), type, rows: [emptyConditionRow()] };
        return { id: uid(), type: "method", content: "", warnings: "" };
      };
      const emptyPanelRow = () => ({ id: uid(), panels: [], texts: [] });
      const emptyTextLine = (position = "before") => ({ id: uid(), content: "", detail: "", result: "", position });
      const emptyStepGroup = (order) => ({ id: uid(), title: "", timing: "", text: "", calloutType: "", callout: "", order, panelRows: [emptyPanelRow()] });
      const emptyProtocolVersion = (label) => ({
        id: uid(), label: label || "v1", savedAt: Date.now(), note: "",
        stepGroups: [emptyStepGroup(1)],
      });
      const emptyProtocol = (name) => {
        const v = emptyProtocolVersion("v1");
        return { id: uid(), name: name || "새 프로토콜", summary: "", scope: "", anticipatedResults: "", troubleshooting: "", activeVersionId: v.id, versions: [v], draftVersion: clone(v) };
      };
      const emptyExperiment = (name) => ({ id: uid(), name: name || "새 실험", memo: "", protocols: [] });
      const emptyNote = () => ({
        id: uid(), date: new Date().toISOString().slice(0, 10), title: "", purpose: "", hypothesis: "",
        conditionOverview: "", resultSummary: "", nextPlan: "", conditionLabels: [],
        linkedProtocolId: null, linkedProtocolVersionId: null, linkedExperimentId: null, linkedStepGroupIds: [],
        execution: { mode: "freeform", stepGroups: [emptyStepGroup(1)], baseStepGroups: [], deviations: [], results: [], stepAnnotations: [], panelAnnotations: [], stepRuns: [] },
      });
      const emptyProject = (name, color) => ({
        id: uid(), name: name || "새 프로젝트", color: color || COLORS[0],
        purpose: "", conditions: "", memo: "",
        experiments: [], notes: [], inventory: [],
        memoScratch: { content: "", updatedAt: null },
        memoSnapshots: [],
      });
      const emptyStore = () => ({
        version: 1,
        projects: [{ ...emptyProject("기본 프로젝트", COLORS[0]), id: DEFAULT_PROJECT_ID }],
        activeProjectId: DEFAULT_PROJECT_ID,
        settings: {},
        createdAt: Date.now(),
      });

      const normalizePanel = (p) => {
        if (!p || typeof p !== "object") return emptyPanel("method");
        if (p.type === "reagent") return { ...p, id: p.id || uid(), type: "reagent", unit: p.unit || "uL", rows: (p.rows || []).map(r => ({ ...emptyReagentRow(), ...r, id: r.id || uid() })) };
        if (p.type === "condition") return { ...p, id: p.id || uid(), type: "condition", rows: (p.rows || []).map(r => ({ ...emptyConditionRow(), ...r, id: r.id || uid() })) };
        return { id: p.id || uid(), type: "method", content: p.content || "", warnings: p.warnings || "" };
      };
      const normalizeStepGroup = (sg, i) => ({
        id: sg.id || uid(), title: sg.title || "", timing: sg.timing || "", text: sg.text || "", calloutType: sg.calloutType || "", callout: sg.callout || "", order: sg.order ?? i + 1,
        panelRows: (sg.panelRows?.length ? sg.panelRows : [emptyPanelRow()]).map(pr => ({
          id: pr.id || uid(),
          panels: (pr.panels || []).map(normalizePanel),
          texts: (pr.texts || []).map(t => typeof t === "string" ? { id: uid(), content: t, detail: "", result: "", position: "before" } : { id: t.id || uid(), content: t.content || "", detail: t.detail || "", result: t.result || "", position: t.position === "after" ? "after" : "before" }),
        })),
      });
      const normalizeVersion = (v) => ({
        id: v.id || uid(), label: v.label || "v1", savedAt: v.savedAt || Date.now(), note: v.note || "",
        stepGroups: (v.stepGroups || [emptyStepGroup(1)]).map(normalizeStepGroup),
      });
      const normalizeProtocol = (p) => {
        const sourceVersions = (p.versions || []).map(normalizeVersion);
        const versions = sourceVersions.length ? sourceVersions : [emptyProtocolVersion()];
        const activeVersionId = p.activeVersionId && versions.some(v => v.id === p.activeVersionId) ? p.activeVersionId : versions[0].id;
        const activeVersion = versions.find(v => v.id === activeVersionId) || versions[0];
        const draftVersion = p.draftVersion && p.draftVersion.id === activeVersionId ? normalizeVersion(p.draftVersion) : clone(activeVersion);
        return { id: p.id || uid(), name: p.name || "프로토콜", summary: p.summary || "", scope: p.scope || "", anticipatedResults: p.anticipatedResults || "", troubleshooting: p.troubleshooting || "", activeVersionId, versions, draftVersion };
      };
      const getProtocolWorkingVersion = (protocol) => protocol?.draftVersion?.id === protocol?.activeVersionId
        ? protocol.draftVersion
        : protocol?.versions?.find(v => v.id === protocol.activeVersionId) || protocol?.versions?.[0] || null;
      const getSelectedProtocolVersion = (protocol, versionId) => versionId && versionId !== "draft"
        ? protocol?.versions?.find(v => v.id === versionId) || getProtocolWorkingVersion(protocol)
        : getProtocolWorkingVersion(protocol);
      const normalizeProject = (p) => ({
        ...emptyProject(), ...p, id: p.id || uid(),
        experiments: (p.experiments || []).map(e => ({
          ...emptyExperiment(), ...e, id: e.id || uid(),
          protocols: (e.protocols || []).map(normalizeProtocol),
        })),
        notes: (p.notes || []).map(n => ({
          ...emptyNote(), ...n, id: n.id || uid(),
          conditionLabels: (n.conditionLabels || []).map(l => ({ id: l.id || uid(), name: l.name || "", color: l.color || COLORS[0], description: l.description || "" })),
          execution: {
            mode: n.execution?.mode || "freeform",
            stepGroups: (n.execution?.stepGroups || []).map(normalizeStepGroup),
            baseStepGroups: (n.execution?.baseStepGroups || []).map(normalizeStepGroup),
            deviations: (n.execution?.deviations || []).map(d => ({ ...d, id: d.id || uid(), planned: d.planned || "" })),
            results: (n.execution?.results || []).map(r => ({ ...r, id: r.id || uid() })),
            stepAnnotations: n.execution?.stepAnnotations || [],
            panelAnnotations: (n.execution?.panelAnnotations || []).map(a => ({ stepGroupId: a.stepGroupId, panelId: a.panelId, labelId: a.labelId })),
            stepRuns: (n.execution?.stepRuns || []).map(r => ({
              stepGroupId: r.stepGroupId, status: ["pending","running","done","skipped"].includes(r.status) ? r.status : "pending",
              planned: r.planned || "", actual: r.actual || "", observation: r.observation || "",
              updatedAt: r.updatedAt || null, completedAt: r.completedAt || null,
            })),
          },
        })),
        inventory: (p.inventory || []).map(it => {
          const numericLevel = Number(it.level);
          return { id: it.id || uid(), name: it.name || "", unit: it.unit || "", level: clamp(Number.isFinite(numericLevel) ? numericLevel : 3, 0, 4), notes: it.notes || "" };
        }),
        memoScratch: { content: p.memoScratch?.content || "", updatedAt: p.memoScratch?.updatedAt || null },
        memoSnapshots: (p.memoSnapshots || []).map((m, i) => ({
          id: m.id || uid(), title: m.title || "제목 없는 메모", body: m.body || "",
          color: m.color || COLORS[3], savedAt: m.savedAt || Date.now(),
          x: m.x ?? 24 + (i % 4) * 228, y: m.y ?? 24 + Math.floor(i / 4) * 190,
        })),
      });
      const normalizeStore = (raw) => {
        const base = emptyStore();
        const projects = (Array.isArray(raw?.projects) && raw.projects.length ? raw.projects : base.projects).map(normalizeProject);
        const activeProjectId = projects.some(p => p.id === raw?.activeProjectId) ? raw.activeProjectId : projects[0]?.id;
        return { ...base, ...raw, version: 1, projects, activeProjectId, settings: raw?.settings || {} };
      };
      const loadStore = () => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? normalizeStore(JSON.parse(saved)) : emptyStore();
        } catch { return emptyStore(); }
      };

      const getActiveProject = (store) =>
        store.projects?.find((p) => p.id === store.activeProjectId) ||
        store.projects?.[0] ||
        emptyProject("기본 프로젝트", COLORS[0]);
      const updateProject = (setStore, projectId, fn) => setStore(s => ({
        ...s, projects: s.projects.map(p => p.id === projectId ? fn(p) : p),
      }));

      const loadScript = (src) =>
        new Promise((resolve, reject) => {
          if (document.querySelector(`script[src="${src}"]`)) return resolve();
          const s = document.createElement("script");
          s.src = src;
          s.onload = () => resolve();
          s.onerror = () => reject(new Error(`스크립트 로드 실패: ${src}`));
          document.head.appendChild(s);
        });

      const diffText = (a, b) => {
        if (typeof diff_match_patch === "undefined") return <span className="diff-changed">{String(b || "")}</span>;
        const dmp = new diff_match_patch();
        const diffs = dmp.diff_main(String(a || ""), String(b || ""));
        dmp.diff_cleanupSemantic(diffs);
        return diffs.map(([op, text], i) => {
          if (op === 0) return <span key={i}>{text}</span>;
          if (op === 1) return <span key={i} className="diff-changed">{text}</span>;
          return <span key={i} className="diff-del">{text}</span>;
        });
      };

      function Button({ children, className = "", ...props }) {
        return <button className={`btn ${className}`} {...props}>{children}</button>;
      }
      function Card({ title, action, children, className = "" }) {
        return (
          <section className={`card ${className}`}>
            {title && <div className="card-head"><h3>{title}</h3>{action}</div>}
            {children}
          </section>
        );
      }
      function ColorPalette({ value, onChange }) {
        return (
          <div className="color-palette">
            {COLORS.map(c => (
              <button key={c} type="button" className={value === c ? "on" : ""} style={{ background: c, color: c }} onClick={() => onChange(c)} aria-label={`색상 ${c}`} />
            ))}
          </div>
        );
      }

      function ReagentPanel({ panel, onChange, readOnly, diffBase }) {
        const rows = panel.rows || [];
        const total = sumVolumes(rows);
        const patchRow = (rid, patch) => onChange({ ...panel, rows: rows.map(r => r.id === rid ? { ...r, ...patch } : r) });
        return (
          <div className="proto-panel reagent-panel">
            <div className="proto-panel-head"><h4>시약</h4></div>
            <div className="proto-panel-body">
              <table className="reagent-table">
                <thead><tr><th className="material-col">Material</th><th className="amount-col">{readOnly ? (panel.unit || "uL") : <input className="reagent-unit-input" value={panel.unit || ""} onChange={e => onChange({ ...panel, unit: e.target.value })} aria-label="시약 부피 단위" placeholder="단위" />}</th><th className="delete-col"></th></tr></thead>
                <tbody>
                  {rows.map(r => {
                    const baseRow = diffBase?.rows?.find(br => br.id === r.id);
                    const isSample = /sample/i.test(r.material);
                    return (
                      <tr key={r.id} className={isSample ? "sample-row" : ""}>
                        <td>
                          {readOnly && diffBase ? diffText(baseRow?.material, r.material) : (
                            <input className="field" value={r.material} readOnly={readOnly} onChange={e => patchRow(r.id, { material: e.target.value })} placeholder="시약명" />
                          )}
                        </td>
                        <td className="amount-col">
                          {readOnly && diffBase ? diffText(baseRow?.volume, r.volume) : (
                            <input className="field" value={r.volume} readOnly={readOnly} onChange={e => patchRow(r.id, { volume: e.target.value })} placeholder="0" />
                          )}
                        </td>
                        <td className="delete-col">{!readOnly && <button className="btn ghost danger" type="button" onClick={() => onChange({ ...panel, rows: rows.filter(x => x.id !== r.id) })}>×</button>}</td>
                      </tr>
                    );
                  })}
                  {readOnly && diffBase?.rows?.filter(br => !rows.some(r => r.id === br.id)).map(br => (
                    <tr key={`removed-${br.id}`} className="diff-removed-row"><td>{br.material || "(빈 시약명)"}</td><td>{br.volume}</td><td>삭제</td></tr>
                  ))}
                  <tr className="total-row"><td>Total</td><td colSpan={2}>{total ? total.toFixed(1) : "—"} {panel.unit || ""}</td></tr>
                </tbody>
              </table>
              {!readOnly && <Button className="soft" style={{ marginTop: 8 }} onClick={() => onChange({ ...panel, rows: [...rows, emptyReagentRow()] })}>+ 행</Button>}
            </div>
          </div>
        );
      }

      function ConditionPanel({ panel, onChange, readOnly, diffBase }) {
        const rows = panel.rows || [];
        const patchRow = (rid, patch) => onChange({ ...panel, rows: rows.map(r => r.id === rid ? { ...r, ...patch } : r) });
        return (
          <div className="proto-panel">
            <div className="proto-panel-head"><h4>반응 조건</h4></div>
            <div className="proto-panel-body">
              <table className="cond-table">
                <thead><tr><th>온도(°C)</th><th>시간</th><th>rpm</th><th></th></tr></thead>
                <tbody>
                  {rows.map(r => {
                    const baseRow = diffBase?.rows?.find(br => br.id === r.id);
                    return (
                      <tr key={r.id}>
                        <td>{readOnly && diffBase ? diffText(baseRow?.temp, r.temp) : <input className="field" value={r.temp} readOnly={readOnly} onChange={e => patchRow(r.id, { temp: e.target.value })} />}</td>
                        <td>{readOnly && diffBase ? diffText(baseRow?.duration, r.duration) : <input className="field" value={r.duration} readOnly={readOnly} onChange={e => patchRow(r.id, { duration: e.target.value })} />}</td>
                        <td>{readOnly && diffBase ? diffText(baseRow?.rpm, r.rpm) : <input className="field" value={r.rpm} readOnly={readOnly} onChange={e => patchRow(r.id, { rpm: e.target.value })} />}</td>
                        <td>{!readOnly && <button className="btn ghost danger" type="button" onClick={() => onChange({ ...panel, rows: rows.filter(x => x.id !== r.id) })}>×</button>}</td>
                      </tr>
                    );
                  })}
                  {readOnly && diffBase?.rows?.filter(br => !rows.some(r => r.id === br.id)).map(br => (
                    <tr key={`removed-${br.id}`} className="diff-removed-row"><td>{br.temp}</td><td>{br.duration}</td><td>{br.rpm}</td><td>삭제</td></tr>
                  ))}
                </tbody>
              </table>
              {!readOnly && <Button className="soft" style={{ marginTop: 8 }} onClick={() => onChange({ ...panel, rows: [...rows, emptyConditionRow()] })}>+ 행</Button>}
            </div>
          </div>
        );
      }

      function MethodPanel({ panel, onChange, readOnly, diffBase }) {
        return (
          <div className="proto-panel">
            <div className="proto-panel-head"><h4>실험 방법</h4></div>
            <div className="proto-panel-body">
              {readOnly && diffBase ? (
                <div className="small" style={{ lineHeight: 1.45 }}>{diffText(diffBase.content, panel.content)}</div>
              ) : (
                <textarea className="field method-textarea" value={panel.content} readOnly={readOnly} onChange={e => onChange({ ...panel, content: e.target.value })} placeholder="세부 지시 사항" />
              )}
              {(panel.warnings || !readOnly) && (
                <>
                  {!readOnly && <label className="label" style={{ marginTop: 8 }}>주의사항</label>}
                  {readOnly ? (
                    panel.warnings && <span className="warning-chip">{diffBase ? diffText(diffBase.warnings, panel.warnings) : panel.warnings}</span>
                  ) : (
                    <>
                      <input className="field" value={panel.warnings} onChange={e => onChange({ ...panel, warnings: e.target.value })} placeholder="예: ice block 필수" />
                      {panel.warnings && <span className="warning-chip">{panel.warnings}</span>}
                    </>
                  )}
                </>
              )}
            </div>
          </div>
        );
      }

      function ProtocolPanel({ panel, onChange, readOnly, diffBase }) {
        if (panel.type === "reagent") return <ReagentPanel panel={panel} onChange={onChange} readOnly={readOnly} diffBase={diffBase} />;
        if (panel.type === "condition") return <ConditionPanel panel={panel} onChange={onChange} readOnly={readOnly} diffBase={diffBase} />;
        return <MethodPanel panel={panel} onChange={onChange} readOnly={readOnly} diffBase={diffBase} />;
      }

      function StepGroupEditor({ stepGroup, onChange, readOnly, diffBase, annotations, panelAnnotations, conditionLabels, onAnnotate, onRemoveAnnotation, onAnnotatePanel, onRemovePanelAnnotation, deviationKeys, resultKeys, autoDeviationKeys, deviations, results, noteMode, stepRun, onPatchRun, onDeviation, onResult, onPatchDeviation, onDeleteDeviation, onPatchResult, onDeleteResult }) {
        const [editingTextId, setEditingTextId] = useState(null);
        const [editingDetailId, setEditingDetailId] = useState(null);
        const [editingTextResultId, setEditingTextResultId] = useState(null);
        const [editingPanelMemoId, setEditingPanelMemoId] = useState(null);
        const [editingPanelResultId, setEditingPanelResultId] = useState(null);
        const updateRow = (rowId, fn) => onChange({ ...stepGroup, panelRows: stepGroup.panelRows.map(r => r.id === rowId ? fn(r) : r) });
        const addPanel = (rowId, type) => updateRow(rowId, r => ({ ...r, panels: [...(r.panels || []), emptyPanel(type)] }));
        const addText = (rowId) => {
          const row = stepGroup.panelRows.find(r => r.id === rowId);
          const line = emptyTextLine((row?.panels || []).length > 0 ? "after" : "before");
          updateRow(rowId, r => ({ ...r, texts: [...(r.texts || []), line] }));
          setEditingTextId(line.id);
        };
        const addPanelRowAfter = (rowId) => onChange({ ...stepGroup, panelRows: stepGroup.panelRows.flatMap(r => r.id === rowId ? [r, emptyPanelRow()] : [r]) });
        const removePanelRow = (rowId) => {
          const row = stepGroup.panelRows.find(r => r.id === rowId);
          const hasContent = (row?.panels || []).length > 0 || (row?.texts || []).some(t => t.content);
          if (hasContent && !window.confirm("이 패널 줄의 패널과 텍스트를 모두 삭제할까요?")) return;
          onChange({ ...stepGroup, panelRows: stepGroup.panelRows.filter(r => r.id !== rowId) });
        };
        const renderTextLines = (row, position) => {
          const lines = (row.texts || []).filter(line => (line.position === "after" ? "after" : "before") === position);
          if (!lines.length) return null;
          return <div className={`protocol-text-lines ${position === "after" ? "after" : ""}`}>{lines.map(line => <div key={line.id} className="protocol-text-entry">
            <div className="protocol-text-line">
              {editingTextId === line.id && !readOnly ? <input className="field" autoFocus value={line.content || ""} onChange={e => updateRow(row.id, r => ({ ...r, texts: (r.texts || []).map(t => t.id === line.id ? { ...t, content: e.target.value } : t) }))} onBlur={() => setEditingTextId(null)} onKeyDown={e => { if (e.key === "Enter" && !isImeComposing(e)) e.currentTarget.blur(); }} placeholder="텍스트를 입력하세요" /> : <button type="button" className={`protocol-text-block ${line.content ? "" : "empty"}`} onClick={() => !readOnly && setEditingTextId(line.id)}>{line.content || "빈 텍스트 — 클릭하여 입력"}</button>}
              {!readOnly && <Button className="ghost danger" aria-label="텍스트 줄 삭제" onClick={() => updateRow(row.id, r => ({ ...r, texts: (r.texts || []).filter(t => t.id !== line.id) }))}>×</Button>}
            </div>
            {noteMode && (editingDetailId === line.id ? <div className="execution-detail-editor">
              <label className="label">실제로 어떻게 수행했는지</label>
              <textarea className="field" autoFocus value={line.detail || ""} onChange={e => updateRow(row.id, r => ({ ...r, texts: (r.texts || []).map(t => t.id === line.id ? { ...t, detail: e.target.value } : t) }))} placeholder="순서, 실제 시간·온도, 실수나 조정 사항 등을 기록하세요." />
              <Button className="soft" onClick={() => setEditingDetailId(null)}>메모 완료</Button>
            </div> : line.detail ? <button type="button" className="execution-detail" onClick={() => setEditingDetailId(line.id)}><strong>ACTUAL EXECUTION</strong>{line.detail}</button> : <Button className="ghost" onClick={() => setEditingDetailId(line.id)}>+ 실제 수행 메모</Button>)}
            {noteMode && (editingTextResultId === line.id ? <div className="execution-detail-editor result">
              <label className="label">결과 기록</label>
              <textarea className="field" autoFocus value={line.result || ""} onChange={e => updateRow(row.id, r => ({ ...r, texts: (r.texts || []).map(t => t.id === line.id ? { ...t, result: e.target.value } : t) }))} placeholder="관찰 결과, 수치, 이미지 번호 등을 기록하세요." />
              <Button className="soft" onClick={() => setEditingTextResultId(null)}>메모 완료</Button>
            </div> : line.result ? <button type="button" className="execution-detail result" onClick={() => setEditingTextResultId(line.id)}><strong>RESULT</strong>{line.result}</button> : <Button className="ghost" onClick={() => setEditingTextResultId(line.id)}>+ 결과 기록</Button>)}
          </div>)}</div>;
        };
        const baseSg = diffBase?.stepGroups ? diffBase.stepGroups.find(s => s.id === stepGroup.id) : diffBase;
        const comparing = readOnly && Boolean(diffBase);
        const run = stepRun || { status: "pending", planned: "", actual: "", observation: "" };
        const stepVariationCount = (deviations || []).filter(d => d.stepGroupId === stepGroup.id).length + [...(autoDeviationKeys || [])].filter(k => k.startsWith(`${stepGroup.id}:`)).length;
        const currentPanelIds = new Set((stepGroup.panelRows || []).flatMap(pr => pr.panels).map(p => p.id));
        const removedPanels = readOnly && baseSg ? (baseSg.panelRows || []).flatMap(pr => pr.panels).filter(p => !currentPanelIds.has(p.id)) : [];
        return (
          <div id={`step-${stepGroup.id}`} className={`step-group ${comparing && !baseSg ? "diff-added-block" : ""}`}>
            <div className="step-head">
              <span className={`step-num ${comparing && baseSg?.order !== stepGroup.order ? "diff-changed" : ""}`}>{stepGroup.order}</span>
              {comparing ? (
                <div className="field grow" style={{ minWidth: 120 }}>{diffText(baseSg?.title, stepGroup.title)}</div>
              ) : (
                <input className="field grow" value={stepGroup.title || (noteMode ? `단계 ${stepGroup.order}` : "")} readOnly={readOnly} onChange={e => onChange({ ...stepGroup, title: e.target.value })} placeholder="단계 제목" style={{ minWidth: 120 }} />
              )}
              {!comparing && <input className="field step-timing" value={stepGroup.timing || ""} readOnly={readOnly} onChange={e => onChange({ ...stepGroup, timing: e.target.value })} placeholder="소요 시간" aria-label="단계 소요 시간" />}
              {noteMode && <span className={`status-chip ${run.status}`}>{run.status === "running" ? "진행 중" : run.status === "done" ? "완료" : run.status === "skipped" ? "건너뜀" : "대기"}</span>}
              {annotations?.length > 0 && annotations.map(a => {
                const label = conditionLabels?.find(l => l.id === a.labelId);
                if (!label) return null;
                return <span key={a.labelId} className="condition-label-chip" style={{ background: `${label.color}22` }} title={label.description || ""}><span className="dot" style={{ background: label.color }} />{label.name}{onRemoveAnnotation && <button type="button" className="btn ghost" aria-label={`${label.name} 라벨 제거`} onClick={() => onRemoveAnnotation(stepGroup.id, label.id)}>×</button>}</span>;
              })}
              {onAnnotate && conditionLabels?.length > 0 && (
                <select className="field" style={{ width: "auto", minHeight: 34 }} onChange={e => { if (e.target.value) { onAnnotate(stepGroup.id, e.target.value); e.target.value = ""; } }} defaultValue="">
                  <option value="">+ 조건 라벨</option>
                  {conditionLabels.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                </select>
              )}
              {!readOnly && <Button className="ghost danger" onClick={() => onChange(null)}>단계 삭제</Button>}
            </div>
            {noteMode && <div className="run-card">
              <div className="run-card-head">
                <div className="run-status">
                  {[["pending","대기"],["running","진행 중"],["done","완료"],["skipped","건너뜀"]].map(([value,label]) => <button type="button" key={value} className={run.status === value ? "active" : ""} onClick={() => onPatchRun?.({ status: value, completedAt: value === "done" ? Date.now() : null })}>{label}</button>)}
                </div>
                <div className="row">
                  {stepVariationCount > 0 && <span className="variation-count">variation {stepVariationCount}개</span>}
                  <Button className="soft" onClick={() => onPatchRun?.({ actual: run.planned.trim() || "프로토콜대로 수행", status: run.status === "pending" ? "running" : run.status })}>계획대로 수행</Button>
                </div>
              </div>
              <div className="run-fields">
                <div className="run-field planned"><label>계획한 variation</label><textarea className="field" value={run.planned || ""} onChange={e => onPatchRun?.({ planned: e.target.value })} placeholder="이 단계에서 바꿀 조건만 적기" /></div>
                <div className="run-field actual"><label>실제로 수행한 내용</label><textarea className="field" value={run.actual || ""} onChange={e => onPatchRun?.({ actual: e.target.value, status: run.status === "pending" ? "running" : run.status })} placeholder="계획과 달랐던 점 또는 실제 조건" /></div>
                <div className="run-field observation"><label>관찰 · 결과</label><textarea className="field" value={run.observation || ""} onChange={e => onPatchRun?.({ observation: e.target.value })} placeholder="색, 침전, 수율, 사진 번호 등" /></div>
              </div>
            </div>}
            {(stepGroup.panelRows || []).map(row => (
              <div key={row.id} className="panel-line-editor">
                {renderTextLines(row, "before")}
                <div className="panel-row-layout">
                <div className="panel-row">
                {(row.panels || []).map((panel, pi) => {
                  const basePanel = baseSg?.panelRows?.flatMap(pr => pr.panels)?.find(p => p.id === panel.id);
                  const panelDiffBase = comparing ? (basePanel || (panel.type === "reagent" || panel.type === "condition" ? { rows: [] } : { content: "", warnings: "" })) : basePanel;
                  const devKey = `${stepGroup.id}:${panel.id}`;
                  const hasDev = deviationKeys?.has(devKey);
                  const hasRes = resultKeys?.has(devKey);
                  const hasAutoDev = autoDeviationKeys?.has(devKey);
                  const panelDeviations = (deviations || []).filter(d => d.stepGroupId === stepGroup.id && d.panelId === panel.id);
                  const panelResults = (results || []).filter(r => r.stepGroupId === stepGroup.id && r.panelId === panel.id);
                  const appliedPanelAnnotations = (panelAnnotations || []).filter(a => a.stepGroupId === stepGroup.id && a.panelId === panel.id);
                  return (
                    <div key={panel.id} className={`panel-instance ${panel.type === "reagent" ? "reagent" : ""} ${hasDev || hasAutoDev ? "deviation-highlight" : ""} ${hasRes ? "result-highlight" : ""}`.trim()}>
                      {noteMode && <div className="panel-label-bar">
                        {appliedPanelAnnotations.map(a => {
                          const label = conditionLabels?.find(l => l.id === a.labelId);
                          return label ? <span key={a.labelId} className="condition-label-chip" style={{ background: `${label.color}22` }}><span className="dot" style={{ background: label.color }} />{label.name}<button type="button" className="btn ghost" aria-label={`${label.name} 패널 라벨 제거`} onClick={() => onRemovePanelAnnotation?.(stepGroup.id, panel.id, label.id)}>×</button></span> : null;
                        })}
                        {conditionLabels?.length > 0 && <select className="field" value="" onChange={e => { if (e.target.value) onAnnotatePanel?.(stepGroup.id, panel.id, e.target.value); }} aria-label="패널 조건 라벨 추가"><option value="">+ 조건 라벨</option>{conditionLabels.filter(l => !appliedPanelAnnotations.some(a => a.labelId === l.id)).map(l => <option key={l.id} value={l.id}>{l.name}</option>)}</select>}
                      </div>}
                      <ProtocolPanel
                        panel={panel}
                        diffBase={panelDiffBase}
                        readOnly={readOnly}
                        onChange={np => updateRow(row.id, r => ({ ...r, panels: r.panels.map((p, i) => i === pi ? np : p) }))}
                      />
                      {!readOnly && (
                        <div className="row" style={{ marginTop: 4 }}>
                          <Button className="ghost danger" onClick={() => updateRow(row.id, r => ({ ...r, panels: r.panels.filter((_, i) => i !== pi) }))}>패널 삭제</Button>
                        </div>
                      )}
                      {noteMode && (
                        <>
                          {hasAutoDev && <div className="auto-deviation">프로토콜과 다르게 편집된 패널</div>}
                          <div className="inline-record-actions">
                            <Button className="ghost" onClick={() => { const id = onDeviation?.(stepGroup.id, panel.id, "manual", summarizePanel(basePanel || panel), ""); if (id) setEditingPanelMemoId(id); }}>+ 실제 수행 메모</Button>
                            <Button className="ghost" onClick={() => { const id = onResult?.(stepGroup.id, panel.id, ""); if (id) setEditingPanelResultId(id); }}>+ 결과 기록</Button>
                          </div>
                          {(panelDeviations.length > 0 || panelResults.length > 0) && <div className="record-block-list">
                            {panelDeviations.map(d => { const memo = d.actual || d.planned || ""; return editingPanelMemoId === d.id || !memo ? <div key={d.id} className="execution-detail-editor">
                              <div className="row between"><label className="label">실제 수행 메모</label><Button className="ghost danger" onClick={() => onDeleteDeviation?.(d.id)}>삭제</Button></div>
                              {d.original && <div className="tiny muted" style={{ marginBottom: 5 }}>프로토콜 기준 · {d.original}</div>}
                              <textarea className="field" autoFocus value={d.actual || ""} onChange={e => onPatchDeviation?.(d.id, { actual: e.target.value })} placeholder="이 패널에서 실제로 바꿔 수행한 내용을 기록하세요." />
                              <Button className="soft" onClick={() => setEditingPanelMemoId(null)}>메모 완료</Button>
                            </div> : <button key={d.id} type="button" className="execution-detail" onClick={() => setEditingPanelMemoId(d.id)}><strong>ACTUAL EXECUTION</strong>{memo}</button>; })}
                            {panelResults.map(r => editingPanelResultId === r.id || !r.content ? <div key={r.id} className="execution-detail-editor result">
                              <div className="row between"><label className="label">결과 기록</label><Button className="ghost danger" onClick={() => onDeleteResult?.(r.id)}>삭제</Button></div>
                              <textarea className="field" autoFocus value={r.content || ""} onChange={e => onPatchResult?.(r.id, { content: e.target.value })} placeholder="관찰 결과, 수치, 이미지 번호 등을 기록하세요." />
                              <Button className="soft" onClick={() => setEditingPanelResultId(null)}>메모 완료</Button>
                            </div> : <button key={r.id} type="button" className="execution-detail result" onClick={() => setEditingPanelResultId(r.id)}><strong>RESULT</strong>{r.content}</button>)}
                          </div>}
                        </>
                      )}
                    </div>
                  );
                })}
                </div>
                {!readOnly && <div className="panel-line-tools panel-primary-tools">
                  <Button className="soft" onClick={() => addPanel(row.id, "reagent")}>+ 시약</Button>
                  <Button className="soft" onClick={() => addPanel(row.id, "condition")}>+ 조건</Button>
                  <Button className="soft" onClick={() => addPanel(row.id, "method")}>+ 방법</Button>
                </div>}
                </div>
                {renderTextLines(row, "after")}
                {!readOnly && <div className="panel-line-secondary">
                  <Button className="ghost" onClick={() => addText(row.id)}>+ 텍스트</Button>
                  <Button className="ghost" onClick={() => addPanelRowAfter(row.id)}>+ 새 패널 줄</Button>
                  {stepGroup.panelRows.length > 1 && <Button className="ghost danger row-remove-button" onClick={() => removePanelRow(row.id)}>줄 삭제</Button>}
                </div>}
              </div>
            ))}
            {removedPanels.length > 0 && <div className="card-pad stack">
              {removedPanels.map(p => <div key={p.id} className="diff-removed-block stack"><strong>삭제된 {p.type === "reagent" ? "시약" : p.type === "condition" ? "반응 조건" : "실험 방법"} 패널</strong><ProtocolPanel panel={p} readOnly onChange={() => {}} /></div>)}
            </div>}
            {stepGroup.text && <div className="protocol-text-lines" style={{ padding: "0 14px 8px" }}><div className="protocol-text-line"><input className="field" value={stepGroup.text} readOnly={readOnly} onChange={e => onChange({ ...stepGroup, text: e.target.value })} aria-label="기존 단계 설명" /><span /></div></div>}
            {!readOnly && <div className="callout-row">
                <select className="field" value={stepGroup.calloutType || ""} onChange={e => onChange({ ...stepGroup, calloutType: e.target.value })} aria-label="주의 표시 종류">
                  <option value="">표시 없음</option><option value="CRITICAL">CRITICAL STEP</option><option value="CAUTION">CAUTION</option><option value="PAUSE">PAUSE POINT</option><option value="TROUBLESHOOTING">TROUBLESHOOTING</option>
                </select>
                <input className="field callout-note" value={stepGroup.callout || ""} onChange={e => onChange({ ...stepGroup, callout: e.target.value })} placeholder="주의점이나 재개 조건" />
            </div>}
            {readOnly && stepGroup.callout && <div style={{ padding: "0 14px 10px" }}><span className="warning-chip">{stepGroup.calloutType || "NOTE"}: {stepGroup.callout}</span></div>}
          </div>
        );
      }

      function PrintPanel({ panel }) {
        if (panel.type === "reagent") {
          const rows = (panel.rows || []).filter(r => r.material || r.volume);
          return <div className="print-static-panel"><div className="print-static-head">시약 · {panel.unit || "단위 없음"}</div><div className="print-static-body">
            {rows.length ? <table className="print-static-table"><thead><tr><th>Material</th><th>Amount</th></tr></thead><tbody>{rows.map(r => <tr key={r.id}><td>{r.material || "—"}</td><td>{r.volume || "—"} {panel.unit || ""}</td></tr>)}<tr className="print-total"><td>Total</td><td>{sumVolumes(rows) ? sumVolumes(rows).toFixed(1) : "—"} {panel.unit || ""}</td></tr></tbody></table> : <span className="muted">입력된 시약 없음</span>}
          </div></div>;
        }
        if (panel.type === "condition") {
          const rows = panel.rows || [];
          return <div className="print-static-panel"><div className="print-static-head">반응 조건</div><div className="print-static-body"><table className="print-static-table"><thead><tr><th>온도</th><th>시간</th><th>rpm</th></tr></thead><tbody>{rows.map(r => <tr key={r.id}><td>{r.temp ? `${r.temp}°C` : "—"}</td><td>{r.duration || "—"}</td><td>{r.rpm || "—"}</td></tr>)}</tbody></table></div></div>;
        }
        return <div className="print-static-panel"><div className="print-static-head">실험 방법</div><div className="print-static-body print-method">{panel.content || "입력된 방법 없음"}{panel.warnings && <div className="print-callout">CAUTION · {panel.warnings}</div>}</div></div>;
      }

      function PrintLayout({ protocol, version, projectName, experimentName }) {
        const summaryItems = [["OVERVIEW",protocol.summary],["SCOPE",protocol.scope],["ANTICIPATED RESULTS",protocol.anticipatedResults],["TROUBLESHOOTING",protocol.troubleshooting]].filter(([,value]) => value);
        return (
          <div className="print-root" id="print-layout">
            <header className="print-header"><div className="print-kicker">LAB PROTOCOL</div><h1 className="print-title">{protocol.name || "Protocol"}</h1><div className="print-subtitle"><span>{projectName}</span><span>{experimentName}</span><span>{version.label}</span><span>{version.stepGroups.length} steps</span></div></header>
            {summaryItems.length > 0 && <div className="print-summary-grid">{summaryItems.map(([label,value]) => <div key={label} className="print-summary-block"><strong>{label}</strong>{value}</div>)}</div>}
            <div className="print-steps-grid">
              {[...version.stepGroups].sort((a, b) => a.order - b.order).map(sg => <article key={sg.id} className="print-step">
                <div className="print-step-head"><span className="print-step-num">{sg.order}</span><span className="print-step-title">{sg.title || "제목 없는 단계"}</span>{sg.timing && <span className="print-timing">{sg.timing}</span>}</div>
                <div className="print-step-body">
                  {sg.panelRows.map(pr => <React.Fragment key={pr.id}>
                    {(pr.texts || []).filter(t => t.position !== "after").map(t => t.content && <div key={t.id} className="print-step-text">{t.content}</div>)}
                    {pr.panels.length > 0 && <div className="print-panel-row">{pr.panels.map(p => <PrintPanel key={p.id} panel={p} />)}</div>}
                    {(pr.texts || []).filter(t => t.position === "after").map(t => t.content && <div key={t.id} className="print-step-text">{t.content}</div>)}
                  </React.Fragment>)}
                  {sg.text && <div className="print-step-text">{sg.text}</div>}
                  {sg.callout && <div className="print-callout">{sg.calloutType || "NOTE"} · {sg.callout}</div>}
                </div>
              </article>)}
            </div>
            <div className="print-footer">Generated {fmtDateTime(Date.now())}</div>
          </div>
        );

      function ProtocolEditor({ project, experiment, protocol, setStore, toast }) {
        const [compareVersionId, setCompareVersionId] = useState(null);
        const [viewMode, setViewMode] = useState("edit");
        const savedVersion = protocol.versions.find(v => v.id === protocol.activeVersionId) || protocol.versions[0];
        const version = protocol.draftVersion?.id === savedVersion.id ? protocol.draftVersion : savedVersion;
        const compareVersion = compareVersionId ? protocol.versions.find(v => v.id === compareVersionId) : null;
        const readOnly = viewMode === "compare";
        const hasDraftChanges = JSON.stringify(version) !== JSON.stringify(savedVersion);

        const patchProtocol = (fn) => updateProject(setStore, project.id, p => ({
          ...p, experiments: p.experiments.map(ex => ex.id !== experiment.id ? ex : {
            ...ex, protocols: ex.protocols.map(pr => pr.id !== protocol.id ? pr : fn(pr)),
          }),
        }));

        const patchVersion = (fn) => patchProtocol(pr => ({ ...pr, draftVersion: fn(pr.draftVersion?.id === pr.activeVersionId ? pr.draftVersion : clone(savedVersion)) }));

        const saveNewVersion = () => {
          const label = window.prompt("버전 이름", `${new Date().toISOString().slice(2, 10).replace(/-/g, "")} v${protocol.versions.length + 1}`);
          if (!label) return;
          const snap = clone(version);
          snap.id = uid(); snap.label = label; snap.savedAt = Date.now();
          patchProtocol(pr => ({ ...pr, activeVersionId: snap.id, versions: [...pr.versions, snap], draftVersion: clone(snap) }));
          toast("새 버전을 저장했습니다");
        };

        const exportPdf = async () => {
          const el = document.getElementById("print-layout");
          if (!el) { toast("PDF 레이아웃을 찾을 수 없습니다"); return; }
          if (!window.html2pdf) { toast("PDF 모듈을 찾을 수 없어 인쇄 창을 엽니다"); setTimeout(() => window.print(), 120); return; }
          try {
            toast("PDF 생성 중…");
            el.classList.add("exporting");
            await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            await window.html2pdf().set({
              margin: 8, filename: `${(protocol.name || "protocol").replace(/[\\/:*?"<>|]/g, "-")}.pdf`,
              image: { type: "jpeg", quality: 0.96 },
              html2canvas: { scale: 1.7, useCORS: true, backgroundColor: "#ffffff", windowWidth: el.scrollWidth, windowHeight: el.scrollHeight, scrollX: 0, scrollY: 0 },
              jsPDF: { unit: "mm", format: "a4", orientation: "landscape" },
              pagebreak: { mode: ["css", "legacy"] },
            }).from(el).save();
            el.classList.remove("exporting");
            toast("PDF 저장 완료");
          } catch (e) {
            el?.classList?.remove("exporting");
            toast("PDF 생성 실패: " + (e.message || e));
          }
        };

        const updateStep = (sgId, val) => patchVersion(v => ({
          ...v, stepGroups: val === null ? v.stepGroups.filter(s => s.id !== sgId).map((s, index) => ({ ...s, order: index + 1 })) : v.stepGroups.map(s => s.id === sgId ? val : s),
        }));

        const sortedSteps = [...version.stepGroups].sort((a, b) => a.order - b.order);
        const jumpToStep = (id) => document.getElementById(`step-${id}`)?.scrollIntoView({ behavior: "smooth", block: "start" });

        return (
          <>
          <div className="stack screen-only">
            <div className="breadcrumb">
              <button type="button" onClick={() => window.__navBack?.()}>← 실험 목록</button>
              <span>/</span><span>{experiment.name}</span><span>/</span><strong>{protocol.name}</strong>
            </div>
            <div className="hero">
              <div>
                <div className="eyebrow">PROTOCOL</div>
                <input className="field page-title" style={{ border: 0, background: "transparent", padding: 0, fontSize: 24, fontWeight: 800 }} value={protocol.name} onChange={e => patchProtocol(pr => ({ ...pr, name: e.target.value }))} />
              </div>
              <div className="row">
                <select className="field" style={{ width: "auto" }} value={protocol.activeVersionId} onChange={e => {
                  const selected = protocol.versions.find(v => v.id === e.target.value);
                  if (selected) patchProtocol(pr => ({ ...pr, activeVersionId: selected.id, draftVersion: clone(selected) }));
                }}>
                  {protocol.versions.map(v => <option key={v.id} value={v.id}>{v.label} ({fmtDateTime(v.savedAt)})</option>)}
                </select>
                {hasDraftChanges && <span className="warning-chip">저장되지 않은 수정</span>}
                <div className="view-toggle">
                  <button className={viewMode === "edit" ? "active" : ""} onClick={() => { setViewMode("edit"); setCompareVersionId(null); }}>편집</button>
                  <button className={viewMode === "compare" ? "active" : ""} onClick={async () => {
                    setViewMode("compare");
                    if (!compareVersionId) setCompareVersionId(protocol.versions.find(v => v.id !== savedVersion.id)?.id || null);
                    if (typeof diff_match_patch === "undefined") {
                      try { await loadScript("https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"); }
                      catch { toast("diff 라이브러리 로드 실패"); }
                    }
                  }}>비교</button>
                </div>
                {viewMode === "compare" && (
                  <select className="field" style={{ width: "auto" }} value={compareVersionId || ""} onChange={e => setCompareVersionId(e.target.value)}>
                    <option value="">비교할 이전 버전</option>
                    {protocol.versions.filter(v => v.id !== version.id).map(v => <option key={v.id} value={v.id}>{v.label}</option>)}
                  </select>
                )}
                <Button className="soft" onClick={saveNewVersion}>수정 버전 저장</Button>
                <Button className="soft" onClick={() => window.print()}>인쇄</Button>
                <Button className="primary" onClick={exportPdf}>PDF 저장</Button>
              </div>
            </div>
            <Card title="프로토콜 개요" className="nature-card">
              <div className="card-pad nature-fields">
                <div><label className="label">개요</label><textarea className="field textarea" value={protocol.summary || ""} onChange={e => patchProtocol(pr => ({ ...pr, summary: e.target.value }))} placeholder="무엇을 위한 프로토콜인지 요약하세요." /></div>
                <div><label className="label">적용 범위 · 전제 조건</label><textarea className="field textarea" value={protocol.scope || ""} onChange={e => patchProtocol(pr => ({ ...pr, scope: e.target.value }))} placeholder="샘플, 장비, 숙련도, 제한 조건" /></div>
                <div><label className="label">예상 결과</label><textarea className="field textarea" value={protocol.anticipatedResults || ""} onChange={e => patchProtocol(pr => ({ ...pr, anticipatedResults: e.target.value }))} placeholder="정상 결과의 기준과 해석" /></div>
                <div><label className="label">트러블슈팅</label><textarea className="field textarea" value={protocol.troubleshooting || ""} onChange={e => patchProtocol(pr => ({ ...pr, troubleshooting: e.target.value }))} placeholder="문제 · 원인 · 해결 방법" /></div>
              </div>
            </Card>
            <div className="protocol-workspace">
              <aside className="protocol-overview">
                <div className="eyebrow">PROTOCOL OVERVIEW</div><h3>전체 단계</h3>
                <div className="tiny muted">단계를 누르면 해당 위치로 이동합니다.</div>
                <div className="overview-list">
                  {sortedSteps.map(sg => <button key={sg.id} className="overview-step" onClick={() => jumpToStep(sg.id)}><strong>{sg.order}. {sg.title || "제목 없는 단계"}</strong><span>{sg.timing || sg.text || sg.panelRows.flatMap(r => r.texts || []).find(t => t.content)?.content || "내용을 추가하세요"}</span></button>)}
                  {!sortedSteps.length && <div className="empty">아직 단계가 없습니다.</div>}
                </div>
              </aside>
              <div className="stack">
                {sortedSteps.length === 0 ? <div className="empty">첫 실험 단계를 추가하세요. 시약 패널은 자동으로 생성되지 않습니다.</div> : sortedSteps.map(sg => (
                  <StepGroupEditor key={sg.id} stepGroup={sg} readOnly={readOnly} diffBase={compareVersion} onChange={val => updateStep(sg.id, val)} />
                ))}
                {readOnly && compareVersion && compareVersion.stepGroups.filter(baseSg => !version.stepGroups.some(sg => sg.id === baseSg.id)).map(baseSg => (
                  <div key={`removed-${baseSg.id}`} className="diff-removed-block stack"><strong>삭제된 단계</strong><StepGroupEditor stepGroup={baseSg} readOnly onChange={() => {}} /></div>
                ))}
                {!readOnly && <Button className="primary" onClick={() => patchVersion(v => ({ ...v, stepGroups: [...v.stepGroups, emptyStepGroup(Math.max(0, ...v.stepGroups.map(s => Number(s.order) || 0)) + 1)] }))}>+ 실험 단계 추가</Button>}
              </div>
            </div>
          </div>
          <PrintLayout protocol={protocol} version={version} projectName={project.name} experimentName={experiment.name} />
          </>
        );
      }

      function ProtocolView({ project, setStore, toast }) {
        const [selExp, setSelExp] = useState(null);
        const [selProto, setSelProto] = useState(null);

        useEffect(() => { setSelExp(null); setSelProto(null); }, [project.id]);
        useEffect(() => {
          window.__navBack = () => { setSelProto(null); setSelExp(null); };
          return () => { delete window.__navBack; };
        }, []);

        const patchProject = (fn) => updateProject(setStore, project.id, fn);

        if (selExp && selProto) {
          const exp = project.experiments.find(e => e.id === selExp);
          const proto = exp?.protocols.find(p => p.id === selProto);
          if (exp && proto) return <ProtocolEditor key={`${project.id}:${proto.id}`} project={project} experiment={exp} protocol={proto} setStore={setStore} toast={toast} />;
        }

        if (selExp) {
          const exp = project.experiments.find(e => e.id === selExp);
          return (
            <div className="stack">
              <div className="breadcrumb"><button type="button" onClick={() => setSelExp(null)}>← 실험 목록</button><span>/</span><strong>{exp?.name}</strong></div>
              <div className="hero"><div className="grow"><div className="eyebrow">EXPERIMENT</div><input className="field page-title" style={{ border: 0, background: "transparent", padding: 0, fontSize: 24, fontWeight: 800 }} value={exp?.name || ""} onChange={ev => patchProject(p => ({ ...p, experiments: p.experiments.map(x => x.id === selExp ? { ...x, name: ev.target.value } : x) }))} aria-label="실험 이름" /></div>
                <Button className="primary" onClick={() => {
                  const p = emptyProtocol("새 프로토콜");
                  patchProject(pr => ({ ...pr, experiments: pr.experiments.map(e => e.id === selExp ? { ...e, protocols: [...e.protocols, p] } : e) }));
                  setSelProto(p.id);
                }}>+ 프로토콜 추가</Button>
              </div>
              {exp?.protocols.length ? exp.protocols.map(p => (
                <Card key={p.id} title={p.name} action={<Button className="soft" onClick={() => setSelProto(p.id)}>열기</Button>}>
                  <div className="card-pad tiny muted">버전 {p.versions.length}개 · 최신 {p.versions.find(v => v.id === p.activeVersionId)?.label}</div>
                </Card>
              )) : <div className="empty">프로토콜을 추가해주세요.</div>}

        return (

            <div className="hero">
              <div><div className="eyebrow">PROTOCOL</div><h1 className="page-title">프로토콜</h1><div className="page-sub">실험별 프로토콜을 패널로 구성하고 버전을 관리하세요.</div></div>
              <Button className="primary" onClick={() => {
                const e = emptyExperiment("새 실험");
                patchProject(p => ({ ...p, experiments: [...p.experiments, e] }));
                setSelExp(e.id);
              }}>+ 실험 추가</Button>
            </div>
            {project.experiments.length ? project.experiments.map(e => (
              <Card key={e.id} title={e.name} action={<Button className="soft" onClick={() => setSelExp(e.id)}>열기 ({e.protocols.length})</Button>}>
                <div className="card-pad stack">
                  <div><label className="label">실험 이름</label><input className="field" value={e.name} onChange={ev => patchProject(p => ({ ...p, experiments: p.experiments.map(x => x.id === e.id ? { ...x, name: ev.target.value } : x) }))} /></div>
                  <div><label className="label">실험 메모</label><input className="field" value={e.memo} onChange={ev => patchProject(p => ({ ...p, experiments: p.experiments.map(x => x.id === e.id ? { ...x, memo: ev.target.value } : x) }))} placeholder="실험 메모" /></div>

      function ConditionLabelModal({ onSave, onClose }) {

              <div className="modal-body">
                <div><label className="label">라벨 이름</label><input className="field" value={name} onChange={e => setName(e.target.value)} placeholder="예: 조건 A" /></div>
                <div><label className="label">설명</label><textarea className="field textarea" value={description} onChange={e => setDescription(e.target.value)} /></div>

      function NoteEditor({ note, project, setStore, toast }) {
        const [showLabelModal, setShowLabelModal] = useState(false);
        const [showChangedOnly, setShowChangedOnly] = useState(false);
        const patchNote = (fn) => updateProject(setStore, project.id, p => ({
          ...p, notes: p.notes.map(n => n.id === note.id ? fn(n) : n),
        }));

        const allProtocols = project.experiments.flatMap(e => e.protocols.map(p => ({ ...p, experimentId: e.id, experimentName: e.name })));

        const loadProtocol = () => {
          const proto = allProtocols.find(p => p.id === note.linkedProtocolId);
          if (!proto) { toast("프로토콜을 선택해주세요"); return; }
          const hasRunRecords = (note.execution.deviations || []).length || (note.execution.results || []).length || (note.execution.panelAnnotations || []).length || (note.execution.stepRuns || []).some(r => r.planned || r.actual || r.observation || r.status !== "pending") || (note.execution.stepGroups || []).some(sg => (sg.panelRows || []).some(pr => (pr.texts || []).some(t => t.detail || t.result)));
          if (hasRunRecords && !window.confirm("현재 variation과 실행 기록을 지우고 프로토콜을 다시 불러올까요?")) return;
          const ver = getSelectedProtocolVersion(proto, note.linkedProtocolVersionId);
          if (!ver) { toast("불러올 프로토콜 버전이 없습니다"); return; }
          let groups = clone(ver.stepGroups);
          if (note.linkedStepGroupIds?.length) groups = groups.filter(g => note.linkedStepGroupIds.includes(g.id));
          groups = groups.map((g, index) => {
            const order = Number(g.order) || index + 1;
            return { ...g, order, title: String(g.title || "").trim() || `단계 ${order}` };
          });
          patchNote(n => ({ ...n, execution: { ...n.execution, mode: "fromProtocol", stepGroups: clone(groups), baseStepGroups: clone(groups), deviations: [], results: [], stepAnnotations: [], panelAnnotations: [], stepRuns: groups.map(g => ({ stepGroupId: g.id, status: "pending", planned: "", actual: "", observation: "", updatedAt: null, completedAt: null })) } }));
          toast(`${note.linkedProtocolVersionId && note.linkedProtocolVersionId !== "draft" ? ver.label : "현재 편집본"} · ${groups.length}단계를 불러왔습니다`);
        };

        const markDeviation = (stepGroupId, panelId, path, original, actual) => {
          const existing = note.execution.deviations.find(d => d.stepGroupId === stepGroupId && d.panelId === panelId && d.path === path);
          if (existing) return existing.id;
          const id = uid();
          patchNote(n => ({
            ...n, execution: {
              ...n.execution,
              deviations: [...n.execution.deviations, { id, stepGroupId, panelId, path, original, planned: "", actual }],
            },
          }));
          return id;
        };

        const addResult = (stepGroupId, panelId, content) => {
          const id = uid();
          patchNote(n => ({
            ...n, execution: {
              ...n.execution,
              results: [...n.execution.results, { id, stepGroupId, panelId, content, savedAt: Date.now() }],
            },
          }));
          return id;
        };

        const deviationKeys = new Set(note.execution.deviations.map(d => `${d.stepGroupId}:${d.panelId}`));
        const resultKeys = new Set(note.execution.results.map(r => `${r.stepGroupId}:${r.panelId}`));
        const basePanels = new Map((note.execution.baseStepGroups || []).flatMap(sg => (sg.panelRows || []).flatMap(pr => pr.panels)).map(p => [p.id, p]));
        const autoDeviationKeys = new Set();
        (note.execution.stepGroups || []).forEach(sg => (sg.panelRows || []).forEach(pr => pr.panels.forEach(panel => {
          const basePanel = basePanels.get(panel.id);
          if (note.execution.mode === "fromProtocol" && (!basePanel || JSON.stringify(basePanel) !== JSON.stringify(panel))) autoDeviationKeys.add(`${sg.id}:${panel.id}`);
        })));
        const currentPanelIds = new Set((note.execution.stepGroups || []).flatMap(sg => (sg.panelRows || []).flatMap(pr => pr.panels)).map(p => p.id));
        const removedBasePanels = note.execution.mode === "fromProtocol" ? [...basePanels.values()].filter(p => !currentPanelIds.has(p.id)) : [];

        const patchDeviation = (id, patch) => patchNote(n => ({ ...n, execution: { ...n.execution, deviations: n.execution.deviations.map(d => d.id === id ? { ...d, ...patch } : d) } }));
        const deleteDeviation = (id) => patchNote(n => ({ ...n, execution: { ...n.execution, deviations: n.execution.deviations.filter(d => d.id !== id) } }));
        const patchResult = (id, patch) => patchNote(n => ({ ...n, execution: { ...n.execution, results: n.execution.results.map(r => r.id === id ? { ...r, ...patch } : r) } }));
        const deleteResult = (id) => patchNote(n => ({ ...n, execution: { ...n.execution, results: n.execution.results.filter(r => r.id !== id) } }));
        const getStepRun = (stepGroupId) => (note.execution.stepRuns || []).find(r => r.stepGroupId === stepGroupId) || { stepGroupId, status: "pending", planned: "", actual: "", observation: "", updatedAt: null, completedAt: null };
        const patchStepRun = (stepGroupId, patch) => patchNote(n => {
          const current = (n.execution.stepRuns || []).find(r => r.stepGroupId === stepGroupId);
          const next = { ...(current || { stepGroupId, status: "pending", planned: "", actual: "", observation: "", completedAt: null }), ...patch, updatedAt: Date.now() };
          return { ...n, execution: { ...n.execution, stepRuns: current ? n.execution.stepRuns.map(r => r.stepGroupId === stepGroupId ? next : r) : [...(n.execution.stepRuns || []), next] } };
        });
        const executionGroups = note.execution.stepGroups || [];
        const finishedCount = executionGroups.filter(sg => ["done","skipped"].includes(getStepRun(sg.id).status)).length;
        const changedStepIds = new Set(executionGroups.filter(sg => {
          const run = getStepRun(sg.id);
          return run.status !== "pending" || run.planned || run.actual || run.observation ||
            note.execution.deviations.some(d => d.stepGroupId === sg.id) || note.execution.results.some(r => r.stepGroupId === sg.id) ||
            (note.execution.panelAnnotations || []).some(a => a.stepGroupId === sg.id) || (sg.panelRows || []).some(pr => (pr.texts || []).some(t => t.detail || t.result)) ||
            [...autoDeviationKeys].some(key => key.startsWith(`${sg.id}:`));
        }).map(sg => sg.id));
        const visibleExecutionGroups = showChangedOnly ? executionGroups.filter(sg => changedStepIds.has(sg.id)) : executionGroups;

        return (
          <div className="stack">
            <div className="breadcrumb"><button type="button" onClick={() => window.__noteBack?.()}>← 노트 목록</button></div>
            <Card title="실험 노트">
              <div className="card-pad stack">
                <div className="row">
                  <div style={{ flex: "0 0 140px" }}><label className="label">날짜</label><input type="date" className="field" value={note.date} onChange={e => patchNote(n => ({ ...n, date: e.target.value }))} /></div>
                  <div className="grow"><label className="label">제목</label><input className="field" value={note.title} onChange={e => patchNote(n => ({ ...n, title: e.target.value }))} /></div>
                </div>
                <div><label className="label">실험 목적</label><textarea className="field textarea" value={note.purpose} onChange={e => patchNote(n => ({ ...n, purpose: e.target.value }))} /></div>
                <div className="note-hypothesis"><label className="label">이번 실험 가설</label><textarea className="field textarea" value={note.hypothesis || ""} onChange={e => patchNote(n => ({ ...n, hypothesis: e.target.value }))} placeholder="어떤 조건이 어떤 결과를 만들 것이라고 예상하는지 적으세요. 예: 코팅 농도를 높이면 세포 부착률이 증가할 것이다." /></div>
                <div><label className="label">이번 실험의 공통 variation</label><textarea className="field textarea" value={note.conditionOverview} onChange={e => patchNote(n => ({ ...n, conditionOverview: e.target.value }))} placeholder="전체 단계에 공통으로 바꾼 샘플, 농도, 배치 조건만 적으세요." /></div>
                <div className="row between">

                onRemovePanelAnnotation={(sgId, panelId, labelId) => patchNote(n => ({ ...n, execution: { ...n.execution, panelAnnotations: (n.execution.panelAnnotations || []).filter(a => !(a.stepGroupId === sgId && a.panelId === panelId && a.labelId === labelId)) } }))}

      function ScratchPad({ project, setStore, toast }) {
        const scratch = project.memoScratch || { content: "", updatedAt: null };
        const [value, setValue] = useState(scratch.content);
        const [showSnap, setShowSnap] = useState(false);
        const timerRef = useRef(null);
        useEffect(() => { setValue(scratch.content); }, [scratch.content]);
        useEffect(() => () => clearTimeout(timerRef.current), []);
        const commit = (text) => updateProject(setStore, project.id, p => ({ ...p, memoScratch: { content: text, updatedAt: Date.now() } }));
        const onChange = (e) => { setValue(e.target.value); clearTimeout(timerRef.current); timerRef.current = setTimeout(() => commit(e.target.value), 400); };
        const saveSnapshot = ({ title, color, clearAfter }) => {
          updateProject(setStore, project.id, p => {
            const list = p.memoSnapshots || [];
            return {
              ...p,
              memoSnapshots: [...list, { id: uid(), title, body: value, color, savedAt: Date.now(), x: 24 + (list.length % 4) * 228, y: 24 + Math.floor(list.length / 4) * 190 }],
              memoScratch: clearAfter ? { content: "", updatedAt: Date.now() } : p.memoScratch,
            };
          });
          if (clearAfter) setValue("");
          setShowSnap(false);
          toast("포스트잇으로 저장했습니다");
        };
        return (
          <Card title="메모장" action={<Button className="primary" onClick={() => value.trim() ? setShowSnap(true) : toast("저장할 내용이 없습니다")}>📌 스냅샷</Button>}>
            <div className="card-pad stack">
              <textarea className="field textarea scratch-textarea" value={value} onChange={onChange} placeholder="자유롭게 메모하세요." />
              <div className="scratch-meta"><span>{value.length}자</span><span>{scratch.updatedAt ? fmtDateTime(scratch.updatedAt) : ""}</span></div>
            </div>
            {showSnap && <SnapshotModal defaultTitle={value.split("\n")[0]?.slice(0, 24)} onClose={() => setShowSnap(false)} onSave={saveSnapshot} />}
          </Card>
        );
      }

      function MemoView({ project, setStore, toast }) {
        const [mode, setMode] = useState("board");
        const [query, setQuery] = useState("");
        const memos = project.memoSnapshots || [];
        const q = query.trim().toLowerCase();
        const filtered = memos.filter(m => !q || `${m.title} ${m.body}`.toLowerCase().includes(q));
        const patchMemo = (id, patch) => updateProject(setStore, project.id, p => ({
          ...p, memoSnapshots: p.memoSnapshots.map(m => m.id === id ? { ...m, ...patch } : m),
        }));
        const startMemoDrag = (event, memo) => {
          event.preventDefault();
          const pointerId = event.pointerId;
          const start = { x: event.clientX, y: event.clientY, ox: memo.x, oy: memo.y };
          const move = ev => {
            if (ev.pointerId !== pointerId) return;
            patchMemo(memo.id, { x: clamp(start.ox + ev.clientX - start.x, 0, MEMO_CANVAS_W - 200), y: clamp(start.oy + ev.clientY - start.y, 0, MEMO_CANVAS_H - 160) });
          };
          const up = ev => {
            if (ev.pointerId !== pointerId) return;
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
            window.removeEventListener("pointercancel", up);
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
          window.addEventListener("pointercancel", up);
        };
        return (
          <div className="stack">
            <div className="hero"><div><div className="eyebrow">MEMO</div><h1 className="page-title">실험 메모</h1></div></div>
            <ScratchPad project={project} setStore={setStore} toast={toast} />
            <Card title={`저장된 메모 ${memos.length}개`} action={
              <div className="view-toggle">
                <button className={mode === "board" ? "active" : ""} onClick={() => setMode("board")}>보드</button>
                <button className={mode === "list" ? "active" : ""} onClick={() => setMode("list")}>목록</button>
              </div>
            }>
              <div className="card-pad">
                <input className="field" value={query} onChange={e => setQuery(e.target.value)} placeholder="검색" style={{ marginBottom: 12 }} />
                {filtered.length === 0 ? <div className="memo-empty empty">저장된 메모가 없습니다.</div> : mode === "board" ? (
                  <div className="memo-board"><div className="memo-canvas">
                    {filtered.map(m => (
                      <div key={m.id} className="memo-card" style={{ left: m.x, top: m.y, background: m.color }}>
                        <div className="memo-drag-handle" onPointerDown={e => startMemoDrag(e, m)} aria-label="메모 이동">⋮⋮ 이동</div>
                        <input className="memo-card-title" value={m.title} onChange={e => patchMemo(m.id, { title: e.target.value })} />
                        <textarea className="memo-card-body" value={m.body} onChange={e => patchMemo(m.id, { body: e.target.value })} />
                        <Button className="ghost danger" onClick={() => { if (confirm("삭제?")) updateProject(setStore, project.id, p => ({ ...p, memoSnapshots: p.memoSnapshots.filter(x => x.id !== m.id) })); }}>삭제</Button>
                      </div>
                    ))}
                  </div></div>
                ) : (
                  <div className="memo-list">{filtered.map(m => (
                    <div key={m.id} className="memo-list-item" style={{ borderLeft: `4px solid ${m.color}` }}>
                      <div className="grow">
                        <input className="memo-card-title" value={m.title} onChange={e => patchMemo(m.id, { title: e.target.value })} />
                        <textarea className="field textarea" style={{ minHeight: 60, marginTop: 6 }} value={m.body} onChange={e => patchMemo(m.id, { body: e.target.value })} />
                      </div>
                      <Button className="ghost danger" onClick={() => updateProject(setStore, project.id, p => ({ ...p, memoSnapshots: p.memoSnapshots.filter(x => x.id !== m.id) }))}>×</Button>
                    </div>
                  ))}</div>
                )}
              </div>
            </Card>
          </div>
        );
      }
